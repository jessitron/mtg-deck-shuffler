apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mtg-deck-shuffler-ingress
  labels:
    app: mtg-deck-shuffler
  annotations:
    external-dns.alpha.kubernetes.io/hostname: mtg.jessitron.honeydemo.io # give your domain name here
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: only-one-alb-please
    # This is the catch-all "/" — evaluated last so more specific rules from
    # other Ingresses in this group (e.g. services/spine/k8s/ingress.yaml's
    # /spine, order "1") get a chance first. Rules across Ingresses in one
    # group aren't auto-sorted by path specificity; without an explicit
    # order, "/" could win the tie and swallow /spine. Range 1-1000.
    alb.ingress.kubernetes.io/group.order: "1000"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # The ALB was health-checking / (which renders a template) every 15s — the
    # default interval — and that was the single biggest source of traces in
    # production. /health is cheap and the sampler keeps only 1% of it.
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=orion-alb-access-logs,access_logs.s3.prefix=orion-alb
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - "mtg.jessitron.honeydemo.io"
  rules:
    - host: "mtg.jessitron.honeydemo.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mtg-deck-shuffler-service
                port:
                  number: 80
