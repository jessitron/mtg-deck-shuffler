apiVersion: v1
kind: ConfigMap
metadata:
  name: mtg-deck-shuffler-config
  labels:
    app: mtg-deck-shuffler
data:
  PORT: "3333"
  OTEL_SERVICE_NAME: "mtg-deck-shuffler"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://api.honeycomb.io:443"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOG_LEVEL: "info"
  TABLETOP_URL: "http://mtg-tabletop-service"
  # http on purpose: the Tabletop's ALB has no 443 listener (tldraw license
  # gate — see apps/tabletop/k8s/ingress.yaml). Plain navigation from this
  # https app to an http link is fine; it's only used in <a href>.
  TABLETOP_PUBLIC_URL: "http://table.jessitron.honeydemo.io"
  SHUFFLER_PUBLIC_URL: "https://mtg.jessitron.honeydemo.io"