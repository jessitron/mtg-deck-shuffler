# Catches https-first browsers and sends them down to http.
#
# The Tabletop is http-only on purpose (see ingress.yaml — tldraw license
# gate), but modern Firefox and Chrome try https:// first for typed URLs.
# With no 443 listener at all, they show "can't connect" instead of falling
# back. This ingress joins the same tabletop-http group but owns ONLY the
# 443 listener (listen-ports scopes per-ingress within an IngressGroup) and
# 301s every request to http://<host>/<same path> via a fixed-redirect
# action. Scoping matters: the redirect must never appear on the :80
# listener, where it would loop.
#
# TLS cert comes from ACM auto-discovery via spec.tls (same mechanism the
# old shared-ALB ingress used for this host). The browser does complete a
# TLS handshake before being redirected — that's fine; the tldraw gate
# cares about the FINAL page origin, which is http.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mtg-tabletop-https-downgrade
  labels:
    app: mtg-tabletop
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: tabletop-http
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/actions.downgrade-to-http: >
      {"type":"redirect","redirectConfig":{"protocol":"HTTP","port":"80","statusCode":"HTTP_301"}}
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - "table.jessitron.honeydemo.io"
  rules:
    - host: "table.jessitron.honeydemo.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: downgrade-to-http
                port:
                  name: use-annotation
