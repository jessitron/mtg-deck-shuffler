# A minimal OpenTelemetry Collector for the Tabletop's BROWSER spans
# (decision: browser telemetry goes to a collector, not a proxy endpoint in the
# tabletop server and not a key in the page). Modeled on the mtg-sparrow
# collector already in this cluster. It reuses the fleet's existing secret
# (mtg-deck-shuffler-secret) so browser spans land in the same Honeycomb
# environment as everything else (mtg-deck-shuffler).
#
# Reached same-origin at https://table.jessitron.honeydemo.io/v1/traces via a
# path rule on the shared ALB (see ingress.yaml) — so prod needs no CORS at
# all; localhost origins are allowed for local dev against the prod collector.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mtg-tabletop-collector-config
  labels:
    app: mtg-tabletop-collector
data:
  relay: |
    exporters:
      otlphttp/honeycomb:
        endpoint: https://api.honeycomb.io
        headers:
          x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    processors:
      batch:
        send_batch_size: 1024
        timeout: 1s
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource/provenance:
        attributes:
          - action: upsert
            key: collector.name
            value: mtg-tabletop-collector
          - action: upsert
            key: collector.cluster
            value: orion
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
            cors:
              allowed_origins:
                - https://table.jessitron.honeydemo.io
                - http://localhost:*
    service:
      extensions:
        - health_check
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource/provenance, batch]
          exporters: [otlphttp/honeycomb]
        # Browser logs — chiefly uncaught errors and unhandled rejections,
        # which have no span to hang attributes on. Same receiver and the same
        # provenance stamping as traces; reached at /v1/logs on this host.
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource/provenance, batch]
          exporters: [otlphttp/honeycomb]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtg-tabletop-collector
  labels:
    app: mtg-tabletop-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mtg-tabletop-collector
  template:
    metadata:
      labels:
        app: mtg-tabletop-collector
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.116.1
          args: ["--config=/etc/otelcol/relay.yaml"]
          env:
            - name: HONEYCOMB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mtg-deck-shuffler-secret
                  key: HONEYCOMB_API_KEY
          ports:
            - containerPort: 4318
            - containerPort: 13133
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 13133
          readinessProbe:
            httpGet:
              path: /
              port: 13133
      volumes:
        - name: config
          configMap:
            name: mtg-tabletop-collector-config
            items:
              - key: relay
                path: relay.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: mtg-tabletop-collector-service
  labels:
    app: mtg-tabletop-collector
  annotations:
    # The ALB health-checks this target group on the collector's health port,
    # not the OTLP port (which 404s anything but /v1/*).
    alb.ingress.kubernetes.io/healthcheck-port: "13133"
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  selector:
    app: mtg-tabletop-collector
  ports:
    - name: otlp-http
      protocol: TCP
      port: 4318
      targetPort: 4318
    - name: health
      protocol: TCP
      port: 13133
      targetPort: 13133
  type: ClusterIP
