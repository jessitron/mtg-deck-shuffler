apiVersion: v1
kind: ConfigMap
metadata:
  name: mtg-tabletop-config
  labels:
    app: mtg-tabletop
data:
  PORT: "5180"
  OTEL_SERVICE_NAME: "mtg-tabletop"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://api.honeycomb.io:443"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOG_LEVEL: "info"
  # Browser spans go to the tabletop's collector, same-origin through the ALB
  # (path /v1/traces on the tabletop host) — no key in the page, no CORS drama.
  # http, NOT https: the ALB has no 443 listener (see ingress.yaml — tldraw
  # license gate). An https URL here would be connection-refused, silently
  # killing all browser telemetry including the uncaught-error pipeline.
  BROWSER_OTLP_TRACES_URL: "http://table.jessitron.honeydemo.io/v1/traces"
  # Browser logs, same collector, same reasoning. Uncaught errors and unhandled
  # rejections have no span to hang attributes on.
  BROWSER_OTLP_LOGS_URL: "http://table.jessitron.honeydemo.io/v1/logs"
  # The Tabletop has no landing page of its own — "/" redirects here. Same
  # value and name the Shuffler's own configmap uses for itself
  # (apps/shuffler/k8s/configmap.yaml); mirrors TABLETOP_PUBLIC_URL for the
  # reverse direction.
  SHUFFLER_PUBLIC_URL: "https://mtg.jessitron.honeydemo.io"
  # In-cluster call, bypasses the ALB entirely — but the Spine always expects its
  # SPINE_BASE_PATH prefix (services/spine/k8s/configmap.yaml), same as the
  # Shuffler's own SPINE_URL (apps/shuffler/k8s/configmap.yaml).
  SPINE_URL: "http://spine-service/spine"
