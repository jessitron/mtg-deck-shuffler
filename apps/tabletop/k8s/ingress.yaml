apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mtg-tabletop-ingress
  labels:
    app: mtg-tabletop
  annotations:
    external-dns.alpha.kubernetes.io/hostname: table.jessitron.honeydemo.io
    kubernetes.io/ingress.class: alb
    # The Tabletop rides its OWN ALB, plain http only — deliberately. tldraw's
    # license gate blanks an unlicensed canvas on HTTPS non-loopback origins;
    # plain http is exempt (README → Licensing). It can't stay in the fleet's
    # shared only-one-alb-please group: ssl-redirect is EXCLUSIVE across an
    # IngressGroup ("once defined on a single Ingress, it impacts every Ingress
    # within IngressGroup"), so there is no per-host http carve-out there.
    # No 443 listener at all: https:// refuses to connect, which beats serving
    # a canvas that blanks 5 seconds after load.
    alb.ingress.kubernetes.io/group.name: tabletop-http
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    # 30s rather than the 15s default: probe traffic was a large share of this
    # ship's traces too.
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    # Same access-log bucket and prefix as the shared ALB: the S3 permission is
    # bucket/prefix-scoped, and object keys embed the ALB name, so logs stay
    # distinguishable.
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=orion-alb-access-logs,access_logs.s3.prefix=orion-alb
    # Websockets ride the ALB's default 60s idle timeout; the tldraw
    # sync client pings well inside that.
spec:
  ingressClassName: alb
  rules:
    - host: "table.jessitron.honeydemo.io"
      http:
        paths:
          # Browser OTLP spans, same-origin, straight to the collector
          - path: /v1/traces
            pathType: Prefix
            backend:
              service:
                name: mtg-tabletop-collector-service
                port:
                  number: 4318
          # Browser OTLP logs — uncaught errors and unhandled rejections
          - path: /v1/logs
            pathType: Prefix
            backend:
              service:
                name: mtg-tabletop-collector-service
                port:
                  number: 4318
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mtg-tabletop-service
                port:
                  number: 80
