apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mtg-tabletop-ingress
  labels:
    app: mtg-tabletop
  annotations:
    external-dns.alpha.kubernetes.io/hostname: table.jessitron.honeydemo.io
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: only-one-alb-please
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    # 30s rather than the 15s default: probe traffic was a large share of this
    # ship's traces too. Per-target-group, so it doesn't touch the shared group.
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=orion-alb-access-logs,access_logs.s3.prefix=orion-alb
    # Websockets ride the shared ALB's default 60s idle timeout; the tldraw
    # sync client pings well inside that, so no group-wide attribute change.
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - "table.jessitron.honeydemo.io"
  rules:
    - host: "table.jessitron.honeydemo.io"
      http:
        paths:
          # Browser OTLP spans, same-origin, straight to the collector
          - path: /v1/traces
            pathType: Prefix
            backend:
              service:
                name: mtg-tabletop-collector-service
                port:
                  number: 4318
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mtg-tabletop-service
                port:
                  number: 80
