apiVersion: v1
kind: ConfigMap
metadata:
  name: spine-config
  labels:
    app: spine
data:
  PORT: "4600"
  RAILS_ENV: "production"
  OTEL_SERVICE_NAME: "spine"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://api.honeycomb.io:443"
  OTEL_METRICS_EXPORTER: "none"
  OTEL_LOGS_EXPORTER: "none"
  # Where the admin screen's trace links point: prod telemetry lands in the
  # mtg-deck-shuffler environment (team modernity).
  HONEYCOMB_TEAM_SLUG: "modernity"
  HONEYCOMB_ENV_SLUG: "mtg-deck-shuffler"
