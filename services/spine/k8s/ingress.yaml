apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spine-ingress
  labels:
    app: spine
  annotations:
    kubernetes.io/ingress.class: alb
    # Same ALB, same host as the Shuffler (apps/shuffler/k8s/ingress.yaml) —
    # mtg.jessitron.honeydemo.io/spine, not its own subdomain. ALB ingress
    # can't rewrite/strip a path prefix, so the app itself answers under
    # /spine (SPINE_BASE_PATH, see k8s/configmap.yaml) rather than the ALB
    # stripping it.
    alb.ingress.kubernetes.io/group.name: only-one-alb-please
    # Rules across Ingresses in one group aren't auto-sorted by path
    # specificity — priority is explicit or undefined. /spine must be
    # evaluated before the Shuffler's catch-all "/", which would otherwise
    # swallow it first. Lower order = evaluated first (range 1-1000).
    # Paired with apps/shuffler/k8s/ingress.yaml's group.order: "1000".
    alb.ingress.kubernetes.io/group.order: "1"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /spine/up
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=orion-alb-access-logs,access_logs.s3.prefix=orion-alb
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - "mtg.jessitron.honeydemo.io"
  rules:
    - host: "mtg.jessitron.honeydemo.io"
      http:
        paths:
          - path: /spine
            pathType: Prefix
            backend:
              service:
                name: spine-service
                port:
                  number: 80
